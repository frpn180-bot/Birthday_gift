<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
      color: white;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .card {
      padding: 45px 25px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      animation: float 3s ease-in-out infinite;
    }

    .cake {
      font-size: 75px;
      animation: bounce 1.5s infinite;
    }

    h1 {
      margin: 15px 0;
      font-size: clamp(2.2rem, 10vw, 4.5rem);
      line-height: 1.1;
      text-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    h2 {
      font-size: clamp(1.3rem, 5vw, 2rem);
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      margin: 10px auto 25px;
      max-width: 450px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: white;
      color: #e84393;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
      transition: .3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    button:active {
      transform: scale(.95);
    }

    #surprise {
      display: none;
      margin-top: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      animation: fadeIn 1s ease;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 1;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 35px 18px;
      }

      .cake {
        font-size: 60px;
      }

      p {
        font-size: .95rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="cake">🎂</div>

      <h1>Happy Birthday!</h1>

      <h2>🎉 Wishing You an Amazing Day! 🎉</h2>

      <p>
        May your birthday be filled with happiness, laughter,
        beautiful memories, and everything that makes you smile. 💖
      </p>

      <button onclick="showSurprise()">
        🎁 Click for a Surprise
      </button>

      <div id="surprise">
        ✨ You deserve all the happiness in the world! ✨
        <br><br>
        🥳 Happy Birthday! 🎈💖
      </div>

    </div>
  </div>

  <script>
    const colors = [
      "#ff4757",
      "#ffd32a",
      "#00d2d3",
      "#1dd1a1",
      "#ff6b81",
      "#a55eea",
      "#ffffff"
    ];

    function createConfetti() {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

      confetti.style.animationDuration =
        (Math.random() * 3 + 2) + "s";

      confetti.style.width =
        (Math.random() * 8 + 6) + "px";

      confetti.style.height =
        (Math.random() * 12 + 8) + "px";

      confetti.style.transform =
        `rotate(${Math.random() * 360}deg)`;

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 6000);
    }

    // Continuous confetti
    setInterval(createConfetti, 120);

    function showSurprise() {
      document.getElementById("surprise").style.display = "block";

      // Extra confetti burst
      for (let i = 0; i < 80; i++) {
        setTimeout(createConfetti, i * 15);
      }
    }

    // Initial celebration
    for (let i = 0; i < 40; i++) {
      setTimeout(createConfetti, i * 50);
    }
  </script>

</body>
</html>
